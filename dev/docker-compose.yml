# A private database and Redis for building on this machine. Never the live
# ones: see dev/backend.sh, which points the backend here explicitly.
name: flowershop-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: flowershop
    ports: ["5441:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6391:6379"]
volumes:
  pgdata:
