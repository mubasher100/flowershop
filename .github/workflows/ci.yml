name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint-and-build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck backend
        working-directory: apps/backend
        run: npx tsc --noEmit

      - name: Typecheck storefront
        working-directory: apps/storefront
        run: npx tsc --noEmit

      # Builds need the env vars present, but not real ones — these are
      # placeholders so the build doesn't fail on missing-var assertions.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          JWT_SECRET: ci-placeholder-jwt-secret
          COOKIE_SECRET: ci-placeholder-cookie-secret
          STORE_CORS: http://localhost:8000
          ADMIN_CORS: http://localhost:9000
          AUTH_CORS: http://localhost:8000,http://localhost:9000
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_placeholder
          NEXT_PUBLIC_BASE_URL: http://localhost:8000

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # Disposable Postgres — CI must never touch Supabase.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret
      COOKIE_SECRET: ci-test-cookie-secret
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:8000,http://localhost:9000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Unit tests
        working-directory: apps/backend
        run: npm run test:unit

      - name: HTTP integration tests
        working-directory: apps/backend
        run: npm run test:integration:http
