name: Deploy storefront (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - "apps/storefront/**"
      - ".github/workflows/deploy-storefront.yml"
  workflow_dispatch:

# Never let two deploys race to the same Worker.
concurrency:
  group: deploy-storefront
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production
    # Off until Cloudflare and the Railway backend exist. The storefront build
    # fetches the Store API for static generation, so without a live backend
    # this job burns ~25 minutes and fails on every push.
    # Enable with: gh variable set CLOUDFLARE_ENABLED --body true
    if: vars.CLOUDFLARE_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build with OpenNext
        working-directory: apps/storefront
        # Next 15 left the Next.js team's two-year support window on
        # 21 Oct 2026, and OpenNext refuses to build it without this flag.
        # Temporary: the way off it is Next 16, which needs the tag-cache
        # setting in open-next.config.ts revisited first (see CLAUDE.md).
        run: npx opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${{ vars.MEDUSA_BACKEND_URL }}
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ secrets.MEDUSA_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_BASE_URL: ${{ vars.STOREFRONT_BASE_URL }}
          # "skipcash" makes customers pay by card before the order is placed.
          # Unset, checkout places orders without payment, as before. Turn it
          # on only once the backend has live SkipCash keys (see CLAUDE.md).
          NEXT_PUBLIC_ONLINE_PAYMENT: ${{ vars.ONLINE_PAYMENT }}
          # NEXT_PUBLIC_DEMO_PAYMENT is deliberately not set: the simulated
          # card gateway came off the live site on 1 Nov 2026, and orders
          # are confirmed on WhatsApp only until SkipCash is live.
          # Turns the contact page's WhatsApp button on once there is a
          # number. Digits with country code, e.g. 97430000000.
          NEXT_PUBLIC_WHATSAPP: ${{ vars.WHATSAPP_NUMBER }}
          # Trader identity shown in the footer and on the legal pages, as
          # Qatar's e-commerce rules require. Rows without a value are not
          # rendered rather than invented.
          NEXT_PUBLIC_LEGAL_NAME: ${{ vars.LEGAL_NAME }}
          NEXT_PUBLIC_LEGAL_CR: ${{ vars.LEGAL_CR }}
          NEXT_PUBLIC_LEGAL_ADDRESS: ${{ vars.LEGAL_ADDRESS }}
          NEXT_PUBLIC_LEGAL_ADDRESS_AR: ${{ vars.LEGAL_ADDRESS_AR }}
          NEXT_PUBLIC_LEGAL_EMAIL: ${{ vars.LEGAL_EMAIL }}
          # Google Analytics 4. Unset means no analytics script ships at all,
          # which is also why the site needs no cookie banner today.
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_MEASUREMENT_ID }}
          # The store name in the header, footer and page titles. Set the
          # BRAND_NAME repo variable once the real name is decided; it falls
          # back to the "Flowershop" placeholder.
          NEXT_PUBLIC_BRAND_NAME: ${{ vars.BRAND_NAME }}
          # Host serving product photography uploaded in the admin — the R2
          # public bucket, e.g. pub-xxxx.r2.dev with pathname /**. next.config
          # adds it to remotePatterns so next/image will accept it.
          NEXT_PUBLIC_MEDIA_HOSTNAME: ${{ vars.MEDIA_HOSTNAME }}
          NEXT_PUBLIC_MEDIA_PATHNAME: ${{ vars.MEDIA_PATHNAME || '/**' }}

      # `opennextjs-cloudflare deploy`, not `wrangler deploy`.
      #
      # wrangler only uploads the Worker. It does not seed the R2 incremental
      # cache with the pages Next prerendered at build time — that is a
      # separate step the adapter owns, and we were skipping it entirely.
      #
      # The consequence was not a slow first request, it was an outage: with
      # nothing in R2, every request was a cache miss that had to render the
      # page inside the Worker, and a full homepage render does not fit in the
      # CPU allowance. Both locales returned Cloudflare 1102 on most requests
      # and could not recover, because the render that would have populated
      # the cache was the thing failing.
      # Remember what is live, so a deploy that breaks the shop can be put back
      # without anyone touching it (see "Check the live site" below).
      - name: Record the live version
        id: previous
        working-directory: apps/storefront
        run: |
          id=$(npx wrangler deployments status --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s).versions||[];const top=v.sort((a,b)=>b.percentage-a.percentage)[0];process.stdout.write(top?top.version_id:"")})') || id=""
          echo "Live before this deploy: ${id:-unknown}"
          echo "version=$id" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy (uploads the Worker and seeds the R2 cache)
        working-directory: apps/storefront
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


      # Runtime secret for /api/revalidate — the endpoint the backend calls
      # so an admin edit is live within a minute. A Worker secret, not a
      # build-time variable: it is read at request time. Re-applied on every
      # deploy so a fresh Worker (a new account, a renamed script) has it.
      - name: Set the revalidation secret on the Worker
        working-directory: apps/storefront
        run: printf '%s' "$REVALIDATE_SECRET" | npx wrangler secret put REVALIDATE_SECRET
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A Cloudflare deploy swaps versions atomically, so visitors never see a
      # half-deployed site — but a broken build would reach every one of them.
      # Walk the pages a customer uses, past the cache (?cb=), and if any fails
      # put the previous version straight back.
      - name: Check the live site (rolls back if it is broken)
        working-directory: apps/storefront
        run: |
          SITE="${{ vars.STOREFRONT_BASE_URL || 'https://tulipsandtruffle.com' }}"
          ok=1
          for path in en-qa ar-qa en-qa/store ar-qa/store en-qa/products/fifty-shimmer-roses en-qa/cart en-qa/checkout api/search-index; do
            code=000
            for try in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 deploy-check' "$SITE/$path?cb=$RANDOM$try") || code=000
              [ "$code" = 200 ] && break
              sleep 5
            done
            echo "$code  $SITE/$path"
            [ "$code" = 200 ] || ok=0
          done
          if [ "$ok" = 1 ]; then exit 0; fi
          if [ -n "$PREVIOUS" ]; then
            echo "::error::The new version is failing; rolling back to $PREVIOUS"
            npx wrangler rollback "$PREVIOUS" -y -m "Automatic rollback: deploy check failed"
          else
            echo "::error::The new version is failing and the previous version is unknown — roll back from the Cloudflare dashboard"
          fi
          exit 1
        env:
          PREVIOUS: ${{ steps.previous.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
